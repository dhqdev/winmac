name: build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        shell: cmd
        run: build.cmd
      - uses: actions/upload-artifact@v4
        with:
          name: WinMac-Setup
          path: dist/WinMac-Setup.exe
